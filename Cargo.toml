[package]
name = "baseaes"
version = "0.4.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
sha2 = { version = "0.10.9", default-features = false }
gtk4 = { version = "0.11.0", default-features = false, features = ["v4_10"] }
glib = { version = "0.22.0", default-features = false }
tree_magic_mini = "3.2.2"
urlencoding = "2.1.3"
png = "0.18.1"
zune-jpeg = "0.5.15"
image-webp = "0.2.4"

# Every dependencies agree to use MIT License

[profile.release]
strip = true
