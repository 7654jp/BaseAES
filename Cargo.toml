[package]
name = "baseaes"
version = "1.2.0"
edition = "2024"

[features]
lang_en = []
lang_ja = []

[dependencies]
aes-gcm = "0.10.3"
sha2 = { version = "0.10.9", default-features = false }
gtk4 = { version = "0.11.0", default-features = false, features = ["v4_10"] }
glib = { version = "0.22.0", default-features = false }
tree_magic_mini = "3.2.2"
urlencoding = "2.1.3"
base64 = "0.22.1"
zune-png = "0.5.2"
zune-jpeg = "0.5.15"
